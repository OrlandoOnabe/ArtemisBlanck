<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Aluno | Artemis</title>

    <link rel="stylesheet" href="../static/css/cadastro_aluno.css">
</head>

<body>

    <header>
        <div class="logo">
            <div class="logo-simbolo">A</div>

            <div>
                <h2>Artemis</h2>
                <span>BLANCK</span>
            </div>
        </div>
    </header>


    <main>

        <section class="cadastro-container">

            <div class="tag">
                <span>●</span>
                Cadastro de Aluno
            </div>

            <h1>Crie sua conta</h1>

            <p class="subtitulo">
                Preencha suas informações para realizar o cadastro
            </p>


            <form class="formulario">

                <!-- Nome -->

                <div class="campo campo-completo">
                    <label for="nome">NOME COMPLETO</label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Maria Clara Ferreira Santos"
                    >
                </div>


                <!-- CPF + Telefone -->

                <div class="linha">

                    <div class="campo">
                        <label for="cpf">CPF</label>

                        <input
                            type="text"
                            id="cpf"
                            name="cpf"
                            placeholder="000.000.000-00"
                        >
                    </div>

                    <div class="campo">
                        <label for="telefone">TELEFONE</label>

                        <input
                            type="tel"
                            id="telefone"
                            name="telefone"
                            placeholder="(11) 99999-0000"
                        >
                    </div>

                </div>


                <!-- RA + Email -->

                <div class="linha">

                    <div class="campo">
                        <label for="ra">RA</label>

                        <input
                            type="text"
                            id="ra"
                            name="ra"
                            placeholder="22.123.456-7"
                        >
                    </div>

                    <div class="campo">
                        <label for="email">E-MAIL INSTITUCIONAL</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="nome@universidade.edu.br"
                        >
                    </div>

                </div>


                <!-- Senhas -->

                <div class="linha">

                    <div class="campo">
                        <label for="senha">SENHA</label>

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="••••••••"
                        >
                    </div>

                    <div class="campo">
                        <label for="confirmar-senha">
                            CONFIRMAR SENHA
                        </label>

                        <input
                            type="password"
                            id="confirmar-senha"
                            name="confirmar_senha"
                            placeholder="••••••••"
                        >
                    </div>

                </div>


                <button type="submit" class="botao-cadastrar">
                    Cadastrar
                </button>

            </form>


            <p class="login">
                Já tem conta?
                <a href="login.html">Fazer login</a>
            </p>

        </section>

    </main>

</body>

</html>
